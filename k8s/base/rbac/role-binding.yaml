# RoleBinding: выдаёт роль pod-reader сервис-аккаунту backend-sa.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-pod-reader-binding
  namespace: todo-app
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: todo-app
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
