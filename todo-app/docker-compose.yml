services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_PORT: "8080"
      POSTGRES_DSN: "postgres://todoapp:todoapp@postgres:5432/todoapp?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      CACHE_TTL_SECONDS: "10"
      RATE_LIMIT_RPM: "120"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: todoapp
      POSTGRES_PASSWORD: todoapp
      POSTGRES_DB: todoapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todoapp -d todoapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
